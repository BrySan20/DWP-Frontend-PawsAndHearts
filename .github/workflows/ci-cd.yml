name: CI/CD Blue-Green

on:
  push:
    branches: [ FrontDevelopment-v3 ]

jobs:
  build-and-push:
    name: Construir y Publicar Imagen Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set lowercase image name
        id: image_name
        run: echo "IMAGE_NAME=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image_name.outputs.IMAGE_NAME }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
  
  deploy:
    name: Desplegar en VPS (Blue-Green)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and Switch Traffic
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deployer/paws-and-hearts
            
            # 1. Definir rutas
            CONFIG_PATH="/etc/nginx/blue-green"
            ACTIVE_ENV_CONFIG=$(readlink $CONFIG_PATH/active_app.conf || echo "")
            
            # 2. Determinar quién es quién (CORREGIDO con nombres de proyecto)
            if [[ "$ACTIVE_ENV_CONFIG" == *"/app.blue.conf" ]]; then
              echo "--- ACTIVO: BLUE (5000) ---"
              echo "--- DESPLEGANDO EN: GREEN (5001) ---"
              INACTIVE_COMPOSE_FILE="docker-compose.green.yml"
              INACTIVE_PROJECT_NAME="green"  # Nombre único para Green
              INACTIVE_PORT="5001"
              INACTIVE_NGINX_CONF="$CONFIG_PATH/app.green.conf"
              OLD_COMPOSE_FILE="docker-compose.blue.yml"
              OLD_PROJECT_NAME="blue"        # Nombre único para Blue
            else
              echo "--- ACTIVO: GREEN (5001) (o NINGUNO) ---"
              echo "--- DESPLEGANDO EN: BLUE (5000) ---"
              INACTIVE_COMPOSE_FILE="docker-compose.blue.yml"
              INACTIVE_PROJECT_NAME="blue"   # Nombre único para Blue
              INACTIVE_PORT="5000"
              INACTIVE_NGINX_CONF="$CONFIG_PATH/app.blue.conf"
              OLD_COMPOSE_FILE="docker-compose.green.yml"
              OLD_PROJECT_NAME="green"       # Nombre único para Green
            fi
            
            echo "--- Descargando nueva imagen... ---"
            # Usamos -p para aislar el proyecto
            docker-compose -p $INACTIVE_PROJECT_NAME -f $INACTIVE_COMPOSE_FILE pull
            
            echo "--- Iniciando nuevo contenedor... ---"
            # Usamos -p para que no borre al otro entorno
            docker-compose -p $INACTIVE_PROJECT_NAME -f $INACTIVE_COMPOSE_FILE up -d --remove-orphans
            
            echo "--- Esperando 30s para inicio correcto... ---"
            sleep 30
            
            echo "--- Probando http://127.0.0.1:$INACTIVE_PORT ---"
            curl --fail -L http://127.0.0.1:$INACTIVE_PORT
            
            if [ $? -ne 0 ]; then
              echo "!!! ERROR: Pruebas fallaron en $INACTIVE_PROJECT_NAME. Revirtiendo. !!!"
              docker-compose -p $INACTIVE_PROJECT_NAME -f $INACTIVE_COMPOSE_FILE down
              exit 1
            fi
            
            echo "--- Pruebas exitosas. Cambiando tráfico... ---"
            
            # Cambiamos el symlink en la ruta correcta
            sudo ln -snf $INACTIVE_NGINX_CONF $CONFIG_PATH/active_app.conf
            sudo systemctl reload nginx
            
            echo "--- TRÁFICO CAMBIADO. Nuevo entorno ACTIVO. ---"
            
            echo "--- Desmantelando entorno antiguo ($OLD_PROJECT_NAME)... ---"
            # Damos de baja el proyecto viejo explícitamente
            docker-compose -p $OLD_PROJECT_NAME -f $OLD_COMPOSE_FILE down --remove-orphans || true
            
            echo "--- DESPLIEGUE BLUE-GREEN COMPLETADO ---"